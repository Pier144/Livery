# Builds the NSIS installer and attaches it to a DRAFT GitHub release.
# Trigger: push a tag `v<version>` (it must match tauri.conf.json), or run it by hand
# (workflow_dispatch), which drafts `v<version>` on the chosen branch's commit.
# Code signing is optional and off until its secrets exist: a certificate of your own
# (WINDOWS_CERTIFICATE) or SignPath (SIGNPATH_API_TOKEN + the SIGNPATH_* variables), never both.
# The updater signing key (TAURI_SIGNING_PRIVATE_KEY) is required: it signs the update feed.
# See docs/release.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.32.1'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ── Toolchains (same as ci.yml) ───────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The installer is named after tauri.conf.json's version; package.json and Cargo.toml
      # carry the same number (docs/release.md, "Cut a release").
      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match tauri.conf.json version ${version} (expected ${tag})."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Enable pnpm through corepack
        run: |
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
          actual=$(pnpm --version)
          if [ "${actual}" != "${PNPM_VERSION}" ]; then
            echo "::error::pnpm ${actual} is active, expected ${PNPM_VERSION}."
            exit 1
          fi

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Restore-only caches: a release never writes a cache, and the Rust build starts clean.
      - name: Restore the pnpm store
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Restore the cargo registry
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      # ── Optional code signing (placeholder) ───────────────────────────────
      # Runs only when the WINDOWS_CERTIFICATE secret exists. The secrets are passed to the two
      # steps that need them, never to the whole job (build scripts run in the build step).
      - name: Check for a signing certificate
        id: signing-check
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if [ -n "${WINDOWS_CERTIFICATE}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing: on"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing: off (no WINDOWS_CERTIFICATE secret). The installer will be unsigned."
          fi

      # Imports the .pfx into the runner's user store and writes a config overlay with its
      # thumbprint. `tauri build` then signs livery.exe, the uninstaller and the installer.
      - name: Import the signing certificate
        id: signing
        if: steps.signing-check.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'livery-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object HasPrivateKey | Select-Object -First 1
          Remove-Item $pfx -Force
          if (-not $cert) { throw 'The certificate has no private key.' }
          $overlay = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm       = 'sha256'
            timestampUrl          = $env:WINDOWS_TIMESTAMP_URL
            tsp                   = $true
          } } } | ConvertTo-Json -Depth 5
          $file = Join-Path $env:RUNNER_TEMP 'tauri.signing.json'
          Set-Content -Path $file -Value $overlay -Encoding utf8NoBOM
          "config=$file" >> $env:GITHUB_OUTPUT
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Write-Host "Signing with certificate $($cert.Subject)"

      # ── Optional SignPath signing (off until the SignPath secret and variables exist) ──
      # SignPath Foundation signs open-source releases for free (docs/release.md, "SignPath").
      # It signs files outside the build, so the build runs in three parts: livery.exe, sent for
      # signing; then the installer around the signed exe, sent for signing; then the updater
      # signature of the signed installer. Each request waits for its approval on signpath.io.
      - name: Check for SignPath
        id: signpath-check
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          CERTIFICATE: ${{ steps.signing-check.outputs.enabled }}
        run: |
          if [ -n "${SIGNPATH_API_TOKEN}" ] && [ -n "${SIGNPATH_ORGANIZATION_ID}" ]; then
            if [ "${CERTIFICATE}" = "true" ]; then
              echo "::error::Both WINDOWS_CERTIFICATE and SignPath are set up. Keep only one."
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SignPath: on"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SignPath: off (no SIGNPATH_API_TOKEN secret or SIGNPATH_ORGANIZATION_ID variable)."
          fi

      # ── Build ─────────────────────────────────────────────────────────────
      # `tauri build` runs `pnpm build` (tsc + vite) first, then cargo in release mode, then makensis,
      # then signs the installer for the updater (`<installer>.sig`, createUpdaterArtifacts).
      - name: Build the installer
        if: steps.signpath-check.outputs.enabled != 'true'
        env:
          SIGNING_CONFIG: ${{ steps.signing.outputs.config }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing: updates can't be signed (docs/release.md, \"Updates\")."
            exit 1
          fi
          if [ -n "${SIGNING_CONFIG}" ]; then
            pnpm tauri build --ci --config "${SIGNING_CONFIG}"
          else
            pnpm tauri build --ci
          fi

      # The SignPath way: the same build, in three parts (see "Check for SignPath"). Bundling writes
      # the bundle type into livery.exe, so it runs once here, before the exe is signed; the
      # second bundle below then finds it written and leaves the signed exe as it is.
      - name: Build the app (SignPath)
        if: steps.signpath-check.outputs.enabled == 'true'
        run: pnpm tauri build --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload livery.exe for signing
        id: upload-exe
        if: steps.signpath-check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/livery.exe
          archive: false
          overwrite: true
          retention-days: 1

      # The only action not from `actions/*`: SignPath verifies the build's origin through it.
      # Pinned to the commit of its v3.0 tag.
      - name: Sign livery.exe (SignPath)
        if: steps.signpath-check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Livery' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_CONFIGURATION || 'exe' }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          # An approver signs off by hand on signpath.io.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-exe
          skip-decompress: true

      - name: Bundle the installer around the signed app (SignPath)
        if: steps.signpath-check.outputs.enabled == 'true'
        run: |
          shopt -s nullglob
          signed=("${RUNNER_TEMP}"/signed-exe/*.exe)
          if [ "${#signed[@]}" -ne 1 ]; then
            echo "::error::Expected one signed exe from SignPath, found ${#signed[@]}."
            exit 1
          fi
          cp "${signed[0]}" src-tauri/target/release/livery.exe
          # The updater signature is written after the installer itself is signed.
          pnpm tauri bundle --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'
          files=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected one NSIS installer, found ${#files[@]}."
            exit 1
          fi
          echo "INSTALLER=${files[0]}" >> "$GITHUB_ENV"

      - name: Upload the installer for signing
        id: upload-installer
        if: steps.signpath-check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.INSTALLER }}
          archive: false
          overwrite: true
          retention-days: 1

      - name: Sign the installer (SignPath)
        if: steps.signpath-check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Livery' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION || 'installer' }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-installer
          skip-decompress: true

      - name: Sign the signed installer for the updater (SignPath)
        if: steps.signpath-check.outputs.enabled == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing: updates can't be signed (docs/release.md, \"Updates\")."
            exit 1
          fi
          shopt -s nullglob
          signed=("${RUNNER_TEMP}"/signed-installer/*.exe)
          if [ "${#signed[@]}" -ne 1 ]; then
            echo "::error::Expected one signed installer from SignPath, found ${#signed[@]}."
            exit 1
          fi
          cp "${signed[0]}" "${INSTALLER}"
          pnpm tauri signer sign "${INSTALLER}"

      - name: Locate the installer
        id: installer
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected one NSIS installer, found ${#files[@]}."
            exit 1
          fi
          installer="${files[0]}"
          if [ ! -s "${installer}.sig" ]; then
            echo "::error::${installer}.sig is missing: the updater signature wasn't written."
            exit 1
          fi
          (cd "$(dirname "$installer")" && sha256sum "$(basename "$installer")" > "$(basename "$installer").sha256")
          # The update feed: the latest *published* release's latest.json is what Livery reads.
          node scripts/updater-manifest.mjs "${installer}" "$(dirname "$installer")/latest.json" "${GITHUB_REPOSITORY}"
          # Every third-party licence in the build (also in the app: About → Licenses).
          notices="$(dirname "$installer")/THIRD-PARTY-NOTICES.txt"
          if [ ! -s public/licenses/rust.txt ] || [ ! -s dist/licenses/javascript.txt ]; then
            echo "::error::The third-party notices are missing (pnpm notices, then the build writes dist/licenses/javascript.txt)."
            exit 1
          fi
          { cat public/licenses/rust.txt; printf '\n\n'; cat dist/licenses/javascript.txt; } > "${notices}"
          echo "path=${installer}" >> "$GITHUB_OUTPUT"
          echo "checksum=${installer}.sha256" >> "$GITHUB_OUTPUT"
          echo "signature=${installer}.sig" >> "$GITHUB_OUTPUT"
          echo "manifest=$(dirname "$installer")/latest.json" >> "$GITHUB_OUTPUT"
          echo "notices=${notices}" >> "$GITHUB_OUTPUT"
          # The same installer under a fixed name, so the README's Download button can always link
          # to releases/latest/download/Livery-setup.exe.
          stable="$(dirname "$installer")/Livery-setup.exe"
          cp "${installer}" "${stable}"
          echo "stable=${stable}" >> "$GITHUB_OUTPUT"
          ls -l "$(dirname "$installer")"

      - name: Verify the signature
        if: steps.signing-check.outputs.enabled == 'true'
        shell: pwsh
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
          THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: |
          $sig = Get-AuthenticodeSignature -FilePath $env:INSTALLER
          Write-Host "Signature status: $($sig.Status) ($($sig.StatusMessage))"
          if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -ne $env:THUMBPRINT) {
            throw 'The installer is not signed with the imported certificate.'
          }

      - name: Verify the SignPath signatures
        if: steps.signpath-check.outputs.enabled == 'true'
        shell: pwsh
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
        run: |
          foreach ($file in @('src-tauri/target/release/livery.exe', $env:INSTALLER)) {
            $sig = Get-AuthenticodeSignature -FilePath $file
            Write-Host "${file}: $($sig.Status), $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$file is not validly signed ($($sig.StatusMessage))." }
          }

      # ── Draft release ─────────────────────────────────────────────────────
      # Draft only: a person reviews the notes, tries the installer and publishes it by hand.
      # Re-running the workflow replaces the assets of the existing draft; a published release
      # is never touched.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          INSTALLER: ${{ steps.installer.outputs.path }}
          CHECKSUM: ${{ steps.installer.outputs.checksum }}
          SIGNATURE: ${{ steps.installer.outputs.signature }}
          MANIFEST: ${{ steps.installer.outputs.manifest }}
          NOTICES: ${{ steps.installer.outputs.notices }}
          STABLE: ${{ steps.installer.outputs.stable }}
        run: |
          if draft=$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "${draft}" != "true" ]; then
              echo "::error::Release ${TAG} is already published. Bump the version to release again."
              exit 1
            fi
            gh release upload "${TAG}" "${INSTALLER}" "${CHECKSUM}" "${SIGNATURE}" "${MANIFEST}" "${NOTICES}" "${STABLE}" --clobber
          else
            gh release create "${TAG}" "${INSTALLER}" "${CHECKSUM}" "${SIGNATURE}" "${MANIFEST}" "${NOTICES}" "${STABLE}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title "Livery ${VERSION}" \
              --notes-file .github/release-notes.md \
              --generate-notes
          fi
          echo "Draft release ${TAG} is ready for review."
