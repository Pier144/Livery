[package]
name = "livery"
version = "0.7.0"
description = "Unofficial War Thunder user-skin manager. Not affiliated with Gaijin Entertainment."
edition = "2021"
# 1.92 although today's dependencies need 1.88 (`image`, `ort` rc.13): it leaves room for
# `ort` rc.14 (1.92), and clippy's lints for this version are already fixed across the crate.
rust-version = "1.92"
license = "GPL-3.0-or-later"
publish = false

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (see Tauri issue #10537).
name = "livery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
zip = { version = "4", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd", "lzma", "time"] }
sevenz-rust2 = "0.23"
# Already in the tree through `zip`; used directly to read the game's own data archives.
zstd = { version = "0.13", default-features = false }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "gzip", "charset", "http2"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
# Oodle (Kraken/Leviathan) decompressor, pure Rust: the game's models and textures are Oodle streams (Atelier).
# Declared MIT, but it is a port of powzix's ooz (GPL-3.0-or-later), so Livery is GPL-3.0-or-later.
oozextract = { version = "0.5.5", default-features = false }
# DXT5 (BC3) encoder, MIT: Atelier writes the painted textures as DDS.
texpresso = "2"
# Picture import for Atelier's image layers (decode, EXIF orientation, resize, PNG assets), MIT OR Apache-2.0.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga"] }
# ONNX Runtime bindings for Atelier's background removal, MIT OR Apache-2.0. `load-dynamic`: the
# runtime DLL is downloaded on request (atelier::models) and loaded at runtime; nothing is bundled.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
# The Linux ONNX Runtime ships as a .tgz: only its library is read out of it (atelier::models).
# Both already in the tree through `tauri-plugin-updater`. MIT OR Apache-2.0.
flate2 = "1"
tar = { version = "0.4", default-features = false }

# Steam install path (HKCU\Software\Valve\Steam) and Atelier's font list live in the registry.
[target."cfg(windows)".dependencies]
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
