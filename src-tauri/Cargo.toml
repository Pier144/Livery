[package]
name = "livery"
version = "0.1.0"
description = "Unofficial War Thunder user-skin manager. Not affiliated with Gaijin Entertainment."
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (see Tauri issue #10537).
name = "livery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
zip = { version = "4", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd", "lzma", "time"] }
sevenz-rust2 = "0.23"
unrar = "0.5"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "gzip", "charset", "http2"] }

# Steam install path lives in the registry (HKCU\Software\Valve\Steam).
[target."cfg(windows)".dependencies]
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
