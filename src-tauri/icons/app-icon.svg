<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Livery app icon: amber dot on graphite. Amber = oklch(0.78 0.16 70) ≈ #F7A224 (resvg has no oklch). -->
