# cargo-about configuration: the licences of every crate in the shipped Windows build, with their
# full texts, written to public/licenses/rust.txt by `pnpm notices` (shown in About → Licenses).
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "bzip2-1.0.6",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]
